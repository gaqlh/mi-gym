<title>Mi app de gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Layout: app de una columna a ancho de teléfono; en pantallas grandes queda centrada como un teléfono. Un solo tema claro, a propósito. */
  :root {
    --page: #DCE2E8; --page-line: #C9D1D9;
    --a-bg: #F3F5F7; --a-fg: #12161B; --a-muted: #5B6672; --a-line: #E1E6EB; --a-card: #FFFFFF;
    --a-accent: #1F5FBF; --a-accent-hover: #184C99; --a-accent-soft: #E3ECF9; --a-accent-soft2: #D3E1F5; --a-on-accent: #FFFFFF;
    --a-dash: #9DB6DE; --a-chip: #EEF1F4; --a-chip-fg: #48525D; --a-chev: #8A939D;
    --a-danger: #B3261E; --a-danger-soft: #FBE9E7; --a-toast: #1B2027; --a-toast-fg: #F1F4F7; --a-hover: #E9EEF3; --a-sub: #F8FAFB;
    --a-input-line: #C9D1D9; --a-box: #9AA4AF; --a-track: #DCE2E8;
    --a-ok: #1E8A4C; --a-ok-ink: #17703D; --a-ok-soft: #DDF1E5; --a-ok-line: #A8D5B9;
    --a-rec-bg: #FFF0BF; --a-rec-fg: #6B4B00; --a-gold: #B98500;
    --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --f-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page); color: var(--a-fg); font: 400 15px/1.4 var(--f-body); -webkit-font-smoothing: antialiased; }

  .app {
    position: relative; isolation: isolate;
    height: 100%; max-width: 460px; margin: 0 auto;
    background: var(--a-bg); color: var(--a-fg);
    display: flex; flex-direction: column; overflow: hidden;
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  }
  @media (min-width: 620px) {
    .app { height: calc(100% - 32px); margin: 16px auto; border-radius: 28px; border: 1px solid var(--page-line); box-shadow: 0 24px 50px -30px rgba(10, 14, 20, .45); }
  }
  :where(.app) button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; }
  :where(.app) input { font: inherit; color: inherit; margin: 0; }
  :where(.app) ul { list-style: none; margin: 0; padding: 0; }
  :where(.app) p { margin: 0; }
  :where(.app) :focus-visible { outline: 2px solid var(--a-accent); outline-offset: 2px; }
  /* En el celular: sin zoom al tocar dos veces seguidas (− y + rápidos), sin destello gris y sin seleccionar texto al mantener */
  :where(.app) button, :where(.app) .upload, :where(.app) a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  :where(.app) input { touch-action: manipulation; }
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .scr-body {
    flex: 1; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
    padding: 14px 16px 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .scr-body::-webkit-scrollbar { display: none; }
  .scr-body.top { padding-top: 22px; }
  .small { font-size: 13.5px; color: var(--a-muted); }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .mono { font-family: var(--f-mono); }

  /* Cargando / sin conexión */
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 32px 28px; text-align: center; }
  .center h1 { margin: 0; font: 700 34px/1 var(--f-display); text-transform: uppercase; }
  .center p { color: var(--a-muted); max-width: 32ch; }
  .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--a-track); border-top-color: var(--a-accent); }
  @media (prefers-reduced-motion: no-preference) { .spinner { animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } }

  /* Imágenes de rutina */
  .art {
    position: relative; display: block; flex: none; overflow: hidden;
    color: var(--pi); border: 1px solid var(--pb);
    background:
      radial-gradient(120% 90% at 85% 8%, rgba(255, 255, 255, .30), rgba(255, 255, 255, 0) 60%),
      repeating-linear-gradient(135deg, rgba(255, 255, 255, .09) 0 5px, rgba(255, 255, 255, 0) 5px 12px),
      var(--pc);
  }
  .art.light {
    background:
      radial-gradient(120% 90% at 85% 8%, rgba(255, 255, 255, .7), rgba(255, 255, 255, 0) 60%),
      repeating-linear-gradient(135deg, rgba(18, 22, 27, .05) 0 5px, rgba(18, 22, 27, 0) 5px 12px),
      var(--pc);
  }
  .art > svg { position: absolute; left: 10%; top: 10%; width: 80%; height: 80%; }
  .art .f { fill: currentColor; stroke: none; }
  .art .hole { fill: var(--pc); stroke: none; }
  .art.photo { background: #1B2027; border-color: #1B2027; }
  .art.photo > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .art.photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0, 0, 0, .55), rgba(0, 0, 0, 0) 65%); }
  .art.thumb { width: 52px; height: 52px; border-radius: 12px; }
  .art.tile { width: 100%; aspect-ratio: 1; border-radius: 12px; }
  .art.wide { width: 100%; height: 118px; border-radius: 14px; }
  .art.wide > svg { left: auto; top: auto; right: 6px; bottom: 0; width: 112px; height: 112px; }
  .art.hero { height: 190px; border: 0; border-radius: 0; }
  .art.hero > svg { left: auto; top: auto; right: -2px; bottom: -6px; width: 150px; height: 150px; }
  .over { position: absolute; z-index: 1; }
  .pv-name { left: 14px; bottom: 12px; right: 120px; font: 700 28px/1 var(--f-display); text-transform: uppercase; letter-spacing: .01em; overflow-wrap: anywhere; }

  /* Inicio */
  .home-head { display: flex; flex-direction: column; gap: 2px; }
  .hh-row { display: flex; align-items: center; justify-content: space-between; margin-right: -8px; }
  .hh-row .small { font-size: 15px; font-weight: 500; }
  .big-date { font: 700 44px/.95 var(--f-display); text-transform: uppercase; letter-spacing: .01em; }
  .big-date em { font-style: normal; color: var(--a-accent); }
  .q { font-size: 18px; font-weight: 600; }
  .demo-note { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--a-muted); padding: 10px 12px; border-radius: 12px; background: var(--a-chip); }
  .demo-note svg { flex: none; margin-top: 1px; }
  .update-note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--a-accent); color: var(--a-on-accent); font-size: 14px; line-height: 1.35; text-decoration: none; }
  .update-note b { font-weight: 700; }
  .update-note svg { flex: none; margin-top: 1px; }

  .rcard { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px 8px 8px; background: var(--a-card); border: 1px solid var(--a-line); border-radius: 14px; transition: border-color .15s, transform .1s; }
  .rcard:hover { border-color: var(--a-dash); }
  .rcard:active { transform: scale(.985); }
  .rc-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .rc-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .rc-name { font-size: 16.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rc-when { flex: none; font-size: 11.5px; color: var(--a-muted); }
  .rc-meta { font-size: 12.5px; color: var(--a-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rc-meta.two { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .chev { flex: none; color: var(--a-chev); }

  .dashed { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 46px; border: 2px dashed var(--a-dash); border-radius: 14px; color: var(--a-accent); font-size: 15.5px; font-weight: 600; }
  .dashed:hover { background: var(--a-accent-soft); }
  .textlink { align-self: center; min-height: 44px; padding: 0 12px; color: var(--a-muted); font-size: 14.5px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
  .textlink:hover { color: var(--a-fg); }

  /* Barras y botones */
  .topbar { flex: none; display: flex; align-items: center; gap: 4px; padding: 10px 12px 8px 6px; background: var(--a-card); border-bottom: 1px solid var(--a-line); }
  .tb-title { flex: 1; font-size: 17px; font-weight: 600; }
  .tb-btn { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 4px 8px; border-radius: 10px; }
  .tb-btn:hover { background: var(--a-hover); }
  .tb-name { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb-sub { font-size: 12.5px; color: var(--a-muted); }
  .tb-sub svg { vertical-align: -2px; margin-left: 2px; }
  .icon-btn { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--a-fg); }
  .icon-btn:hover { background: var(--a-hover); }
  .icon-btn.subtle { color: var(--a-chev); }
  .link-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px; color: var(--a-accent); font-size: 14.5px; font-weight: 600; align-self: flex-start; }
  .link-btn:hover { color: var(--a-accent-hover); }
  .btn-primary { min-height: 38px; padding: 0 14px; border-radius: 10px; background: var(--a-accent); color: var(--a-on-accent); font-size: 14.5px; font-weight: 600; text-align: center; }
  .btn-primary:hover { background: var(--a-accent-hover); }
  .btn-primary:disabled { opacity: .45; cursor: default; }
  .btn-outline { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 46px; border: 2px solid var(--a-accent); border-radius: 14px; background: var(--a-card); color: var(--a-accent); font-size: 15px; font-weight: 600; }
  .btn-outline:hover { background: var(--a-accent-soft); }
  .btn-del { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 46px; border: 1.5px solid var(--a-danger); border-radius: 14px; background: var(--a-card); color: var(--a-danger); font-size: 15px; font-weight: 600; }
  .btn-del:hover { background: var(--a-danger-soft); }
  .fab { flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--a-accent); color: var(--a-on-accent); display: grid; place-items: center; }
  .fab:hover { background: var(--a-accent-hover); }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .scr-title { font: 700 36px/1 var(--f-display); text-transform: uppercase; letter-spacing: .01em; }

  /* Rutina del día */
  .hero-top { top: 12px; left: 10px; right: 12px; display: flex; align-items: center; justify-content: space-between; }
  .hb { color: inherit; background: rgba(0, 0, 0, .22); }
  .art.light .hb { background: rgba(18, 22, 27, .08); }
  .hb:hover { background: rgba(0, 0, 0, .32); }
  .art.light .hb:hover { background: rgba(18, 22, 27, .14); }
  .hb.pill { min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; }
  .hero-txt { left: 18px; bottom: 16px; right: 128px; display: flex; flex-direction: column; gap: 2px; }
  .hero-date { font-size: 13.5px; font-weight: 600; opacity: .92; }
  .hero-name { font: 700 40px/.95 var(--f-display); text-transform: uppercase; letter-spacing: .01em; overflow-wrap: anywhere; }
  .progress { display: flex; flex-direction: column; gap: 6px; }
  .prog-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--a-muted); }
  .bar { height: 6px; border-radius: 3px; background: var(--a-track); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--a-ok); border-radius: 3px; transition: width .3s; }
  .exlist { display: flex; flex-direction: column; gap: 8px; }
  .exrow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; background: var(--a-card); border: 1px solid var(--a-line); border-radius: 12px; }
  .exrow:hover { border-color: var(--a-dash); }
  .status { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--a-box); display: grid; place-items: center; color: var(--a-on-accent); }
  .status.done { background: var(--a-ok); border-color: var(--a-ok); }
  .ex-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .ex-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
  .ex-name { font-size: 15px; font-weight: 600; }
  .chip { flex: none; font-size: 10.5px; font-weight: 600; color: var(--a-chip-fg); background: var(--a-chip); border-radius: 6px; padding: 2px 6px; }
  .chip.today, .chip.link { color: var(--a-accent); background: var(--a-accent-soft); }
  .ex-last { font: 400 12px/1.4 var(--f-mono); color: var(--a-muted); font-variant-numeric: tabular-nums; }
  .ex-last.done { color: var(--a-ok-ink); font-weight: 500; }
  .empty { padding: 16px; border: 1px dashed var(--a-box); border-radius: 12px; color: var(--a-muted); font-size: 14px; text-align: center; }
  .sgroup { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 14px; background: var(--a-accent-soft); }
  .sg-head { display: flex; align-items: center; gap: 6px; padding: 0 4px; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--a-accent); }
  .sg-list { display: flex; flex-direction: column; gap: 6px; }

  /* Anotar series */
  .exstrip { position: relative; flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; background: var(--a-card); border-bottom: 1px solid var(--a-line); scrollbar-width: none; }
  .exstrip::-webkit-scrollbar { display: none; }
  .xchip { flex: none; display: inline-flex; align-items: center; gap: 6px; max-width: 176px; min-height: 36px; padding: 0 8px 0 12px; border-radius: 999px; border: 1px solid var(--a-input-line); background: var(--a-card); color: var(--a-fg); font-size: 13.5px; font-weight: 600; }
  .xchip:hover { border-color: var(--a-dash); }
  .xn { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xc { flex: none; font: 600 11.5px/1 var(--f-mono); color: var(--a-chip-fg); background: var(--a-chip); border-radius: 999px; padding: 3px 6px; }
  .xchip.done { border-color: var(--a-ok-line); }
  .xchip.done .xc { background: var(--a-ok-soft); color: var(--a-ok-ink); }
  .xchip.on { background: var(--a-fg); border-color: var(--a-fg); color: var(--a-on-accent); }
  .xchip.on .xc { background: rgba(255, 255, 255, .2); color: var(--a-on-accent); }
  .xchip .lnk { flex: none; display: inline-flex; color: var(--a-accent); }
  .xchip.on .lnk { color: var(--a-on-accent); }
  .xchip.add { color: var(--a-accent); border-style: dashed; border-color: var(--a-dash); padding-right: 12px; }
  .superbox { display: flex; align-items: flex-start; gap: 10px; padding: 10px 6px 10px 12px; border-radius: 12px; background: var(--a-accent-soft); }
  .superbox > svg { flex: none; color: var(--a-accent); margin-top: 2px; }
  .sb-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; line-height: 1.35; color: var(--a-muted); }
  .sb-txt b { color: var(--a-fg); font-size: 14px; font-weight: 600; }
  .sb-x { flex: none; min-height: 32px; padding: 0 8px; color: var(--a-accent); font-size: 13px; font-weight: 600; }
  .card { background: var(--a-card); border: 1px solid var(--a-line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card-title { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--a-muted); }
  .card-date { font-size: 12.5px; color: var(--a-muted); }
  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-foot .small { font-size: 12px; }
  .link-sm { flex: none; display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 0 4px; color: var(--a-accent); font-size: 13px; font-weight: 600; }
  .link-sm svg { color: var(--a-gold); }
  .cmp-scroll { position: relative; overflow-x: auto; scrollbar-width: none; }
  .cmp-scroll::-webkit-scrollbar { display: none; }
  .cmp { display: grid; gap: 6px; align-items: center; width: max-content; }
  .cmp-n { font: 600 11px/1 var(--f-mono); color: var(--a-muted); text-align: center; }
  .cmp-lbl { font-size: 12px; font-weight: 600; line-height: 1.15; color: var(--a-muted); }
  .cmp-lbl.today { color: var(--a-fg); font-size: 13px; }
  .cmp-c { display: flex; align-items: center; justify-content: center; gap: 3px; min-height: 34px; padding: 0 7px; border-radius: 8px; font: 500 12.5px/1 var(--f-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cmp-c.past { background: var(--a-chip); color: var(--a-fg); }
  .cmp-c.empty { color: var(--a-chev); }
  .cmp-c.done { background: var(--a-ok-soft); color: var(--a-ok-ink); font-weight: 600; }
  .cmp-c.done:hover { outline: 1.5px solid var(--a-ok-line); }
  .cmp-c.done.rec { background: var(--a-rec-bg); color: var(--a-rec-fg); }
  .cmp-c.next { border: 1.5px dashed var(--a-accent); color: var(--a-accent); font: 600 12px/1 var(--f-body); }
  .cmp-c.editing { outline: 2px solid var(--a-accent); outline-offset: 1px; }
  .serie { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; }
  .serie-n { font: 700 24px/1 var(--f-display); text-transform: uppercase; letter-spacing: .01em; }
  .stepper { display: flex; flex-direction: column; gap: 6px; }
  .st-lbl { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--a-muted); }
  .st-ctl { display: flex; align-items: center; gap: 8px; }
  .st-btn { flex: none; width: 52px; height: 52px; border-radius: 12px; background: var(--a-accent-soft); color: var(--a-accent); font-size: 28px; font-weight: 500; line-height: 1; display: grid; place-items: center; text-align: center; }
  .st-btn:hover { background: var(--a-accent-soft2); }
  .st-inp { flex: 1; min-width: 0; width: 100%; height: 52px; text-align: center; font: 600 28px/1 var(--f-mono); font-variant-numeric: tabular-nums; border: 1px solid var(--a-input-line); border-radius: 12px; background: var(--a-card); color: var(--a-fg); }
  .st-inp:focus { outline: 2px solid var(--a-accent); outline-offset: 1px; border-color: transparent; }
  .rec-hint { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--a-muted); }
  .rec-hint:empty { display: none; }
  .rec-hint svg { flex: none; color: var(--a-gold); }
  .rec-hint.on { color: var(--a-rec-fg); background: var(--a-rec-bg); padding: 6px 10px; border-radius: 10px; font-weight: 600; }
  .btn-save { width: 100%; min-height: 52px; border-radius: 14px; background: var(--a-accent); color: var(--a-on-accent); font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
  .btn-save:hover { background: var(--a-accent-hover); }
  .edit-row { display: flex; gap: 8px; }
  .btn-ghost, .btn-danger { flex: 1; min-height: 44px; border-radius: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-align: center; }
  .btn-ghost { border: 1px solid var(--a-line); color: var(--a-muted); background: var(--a-card); }
  .btn-danger { border: 1.5px solid var(--a-danger); color: var(--a-danger); background: var(--a-card); }
  .log-foot { flex: none; padding: 10px 16px 14px; background: var(--a-card); border-top: 1px solid var(--a-line); display: flex; flex-direction: column; gap: 10px; }
  .rest { display: flex; align-items: center; gap: 10px; }
  .rest-info { display: flex; flex-direction: column; min-width: 66px; }
  .rest-lbl { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--a-muted); }
  .rest-time { font: 600 22px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
  .rest-track { flex: 1; height: 6px; border-radius: 3px; background: var(--a-track); overflow: hidden; }
  .rest-bar { height: 100%; background: var(--a-accent); transition: width .25s linear; }
  .rest-btn { flex: none; min-height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--a-line); font-size: 13px; font-weight: 600; color: var(--a-accent); }
  .rest-btn:hover { background: var(--a-accent-soft); }

  // ---------- Traer datos de FitNotes ----------
  // La app Android lee el respaldo .fitnotes (SQLite) y entrega sus tablas tal cual; aquí se convierten
  var MUSCLE_ALIASES = {
    pecho: 'Pecho', chest: 'Pecho', espalda: 'Espalda', back: 'Espalda', hombros: 'Hombros', hombro: 'Hombros', shoulders: 'Hombros',
    biceps: 'Bíceps', triceps: 'Tríceps', piernas: 'Piernas', pierna: 'Piernas', legs: 'Piernas',
    abdomen: 'Abdomen', abs: 'Abdomen', abdominales: 'Abdomen', cardio: 'Cardio'
  };
  function plain(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim(); }
  function mapMuscle(name) {
    var k = plain(name);
    if (MUSCLE_ALIASES[k]) return MUSCLE_ALIASES[k];
    var t = String(name || '').trim();
    return t ? cap(t) : 'Otros';
  }
  function guessImage(name, muscles) {
    var n = plain(name);
    if (/pierna|leg|gluteo|cuadri/.test(n)) return 'sentadilla';
    if (/empuje|push/.test(n)) return 'militar';
    if (/jalon|pull|tiron|espalda|back/.test(n)) return 'dominada';
    if (/torso|upper|pecho|chest/.test(n)) return 'banca';
    if (/brazo|arm|biceps|triceps/.test(n)) return 'brazos';
    if (/abs|abdom|core/.test(n)) return 'abdomen';
    if (/cardio|correr|run/.test(n)) return 'cardio';
    return { 'Pecho': 'banca', 'Espalda': 'dominada', 'Hombros': 'militar', 'Bíceps': 'brazos', 'Tríceps': 'fondos', 'Piernas': 'sentadilla', 'Abdomen': 'abdomen', 'Cardio': 'cardio' }[muscles[0]] || 'mancuerna';
  }
  function convertFitNotes(raw) {

    (raw.categories || []).forEach(function (c) { cat[c[0]] = mapMuscle(c[1]); });
    (raw.exercises || []).forEach(function (e) {
      var id = 'fn-' + e[0];
      exId[e[0]] = id;
      exercises[id] = { name: String(e[1] || 'Ejercicio').trim(), muscle: cat[e[2]] || 'Otros' };
    });
    // Cada día de una rutina de FitNotes es una rutina aquí
    var routines = {}, secId = {}, perRoutine = {}, order = 0;
    (raw.sections || []).forEach(function (s) { perRoutine[s[0]] = (perRoutine[s[0]] || 0) + 1; });
    (raw.sections || []).forEach(function (s) {
      var id = 'fn-r' + s[2], rName = String(s[1] || '').trim(), sName = String(s[3] || '').trim();
      var name = perRoutine[s[0]] > 1 ? (sName || rName) : (rName || sName);
      secId[s[2]] = id;
      routines[id] = { name: name || 'Rutina', color: COLOR_ORDER[order % COLOR_ORDER.length], image: 'mancuerna', photo: null, ex: [], groups: [], order: ++order };
    });
    (raw.sectionEx || []).forEach(function (x) {
      var r = routines[secId[x[0]]], e = exId[x[1]];
      if (r && e && r.ex.indexOf(e) < 0) r.ex.push(e);
    });
    Object.keys(routines).forEach(function (id) {
      var r = routines[id], count = {};
      r.ex.forEach(function (e) { var m = exercises[e].muscle; count[m] = (count[m] || 0) + 1; });
      r.image = guessImage(r.name, Object.keys(count).sort(function (a, b) { return count[b] - count[a]; }));
    });
    // Series por día; la rutina de cada día es la que más series aportó
    var setSec = {}, workouts = {}, votes = {}, sets = 0;
    (raw.setSection || []).forEach(function (x) { setSec[x[0]] = x[1]; });
    (raw.logs || []).forEach(function (l) {
      var e = exId[l[0]], reps = Math.round(+l[3]), kg = Math.round((+l[2] || 0) * 100) / 100, d = String(l[1] || '').slice(0, 10);
      if (!e || !(reps > 0) || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
      var w = workouts[d] || (workouts[d] = { date: d, routineId: 'free', extra: [], groups: [], sets: {} });
      (w.sets[e] = w.sets[e] || []).push({ w: kg, r: reps });
      sets++;
      var rid = secId[setSec[l[4]]];
      if (rid) { var v = votes[d] || (votes[d] = {}); v[rid] = (v[rid] || 0) + 1; }
    });
    Object.keys(votes).forEach(function (d) {
      var v = votes[d], best = null;
      Object.keys(v).forEach(function (rid) { if (!best || v[rid] > v[best]) best = rid; });

      stats: { sets: sets, days: days.length, first: days[0], last: days[days.length - 1], exercises: Object.keys(exercises).length, routines: Object.keys(routines).length }
    };
  }
  function fmtCount(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

  function startDevice() {

  function setLocal(col, id, body) {

  // Escribe un documento: se ve al instante y se guarda en orden, una escritura a la vez por documento
  function writeDoc(col, id, body) {
    setLocal(col, id, body);
    if (mode === 'device') { persistSoon(); return; }
    if (mode !== 'db') return;
    var path = col + '/' + id;
    pending[path] = { col: col, id: id, body: body };
    if (running[path]) return;
    running[path] = true;
    (function loop() {
      var job = pending[path];
      if (!job) { running[path] = false; return; }
      delete pending[path];
      var ref = db.collection(job.col).doc(job.id);

  }

  function subscribe() {
    ['exercises', 'routines', 'workouts'].forEach(function (col) {
      db.collection(col).onSnapshot(function (snap) {
        var next = {};
        snap.docs.forEach(function (d) { next[d.id] = d.data(); });
        DATA[col] = next;
        loaded[col] = true;
        app.schedule();
      }, function () {
        loaded[col] = true;
        app.toast('Se perdió la conexión con tus datos. Recarga la app.');
        app.schedule();
      });
    });
    db.doc('settings/app').onSnapshot(function (d) {
      if (d.exists) DATA.settings = Object.assign(clone(DEFAULT_SETTINGS), d.data());

  }

  // ---------- La app ----------
  function App(el) {
    var self = this;
    this.el = el;
    this.view = el.querySelector('.view');
    this.toastEl = el.querySelector('.toast');
    this.timer = null;
    this.restTimer = null;

    this.scheduled = false;
    this.wakeLock = null;
    this.st = {
      screen: 'home', autoDay: true,
      log: null, rest: null, draft: null, returnTo: 'routines',
      pick: null, search: '', open: { 'Pecho': true }, newEx: null,
      sheet: null, confirm: null
    };

    el.addEventListener('click', function (e) {
      var t = e.target.closest('[data-act]');
      if (!t || !el.contains(t) || t.disabled) return;
      self.act(t.getAttribute('data-act'), t.getAttribute('data-id'));
    });
    el.addEventListener('input', function (e) {
      var key = e.target.getAttribute && e.target.getAttribute('data-input');
      if (key) self.onInput(key, e.target.value);
    });
    el.addEventListener('change', function (e) {
      var t = e.target;
      if (t.getAttribute && t.getAttribute('data-file') === 'photo' && t.files && t.files[0]) self.loadPhoto(t.files[0]);
    });
    el.addEventListener('keydown', function (e) {
      var key = e.target.getAttribute && e.target.getAttribute('data-input');
      if (e.key === 'Escape' && self.st.sheet) { self.act('close-sheet'); return; }
      if (e.key !== 'Enter' || !key) return;
      if (key === 'rname') { e.preventDefault(); self.act('save-routine'); }
      if (key === 'exname') { e.preventDefault(); self.act('newex-save'); }
      if (key === 'w' || key === 'r') { e.preventDefault(); self.act('save-set'); }
    });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && self.st.screen === 'log') self.keepAwake();
      if (document.visibilityState === 'visible') self.schedule();
    });
  }

  // --- Lectura de datos ---
  App.prototype.ex = function (id) { var e = DATA.exercises[id]; return e ? Object.assign({ id: id }, e) : null; };
  App.prototype.routine = function (id) { var r = DATA.routines[id]; return r ? Object.assign({ id: id }, r) : null; };
  App.prototype.routinesSorted = function () {
    return Object.keys(DATA.routines).map(this.routine, this).sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  };
  App.prototype.routineEx = function (r) { return (r.ex || []).filter(function (id) { return !!DATA.exercises[id]; }); };
  App.prototype.musclesOf = function (r) {
    var seen = [];
    this.routineEx(r).forEach(function (id) { var m = DATA.exercises[id].muscle; if (seen.indexOf(m) < 0) seen.push(m); });
    return seen.join(', ').toLowerCase();
  };
  App.prototype.routineLast = function (rid) {
    var best = null, k = todayK();
    Object.keys(DATA.workouts).forEach(function (d) {
      if (d <= k && DATA.workouts[d].routineId === rid && (!best || d > best)) best = d;
    });
    return best;
  };
  App.prototype.todayDoc = function () { return DATA.workouts[todayK()] || null; };
  App.prototype.todayActive = function () { var w = this.todayDoc(); return !!(w && w.routineId); };
  App.prototype.todayGroups = function () { var w = this.todayDoc(); return w ? toGroups(w.groups) : []; };
  App.prototype.todaySets = function (id) { var w = this.todayDoc(); return w && w.sets ? toSets(w.sets[id]) : []; };
  App.prototype.dayIds = function () {
    var w = this.todayDoc();
    if (!w) return [];
    var base = [];
    if (w.routineId && w.routineId !== 'free' && DATA.routines[w.routineId]) base = DATA.routines[w.routineId].ex || [];
    var withSets = Object.keys(w.sets || {}).filter(function (id) { return w.sets[id] && w.sets[id].length; });
    var out = [];
    base.concat(w.extra || [], withSets).forEach(function (id) {
      if (out.indexOf(id) < 0 && DATA.exercises[id]) out.push(id);
    });
    return out;
  };
  App.prototype.pastWorkouts = function () {
    var k = todayK();
    return Object.keys(DATA.workouts).filter(function (d) { return d < k; }).sort().reverse().map(function (d) { return DATA.workouts[d]; });
  };
  App.prototype.lastTime = function (id) {
    var list = this.pastWorkouts();
    for (var i = 0; i < list.length; i++) {
      var s = list[i].sets && list[i].sets[id];
      if (s && s.length) return { date: list[i].date, sets: toSets(s) };
    }
    return null;
  };
  App.prototype.historyFront = function (id) {
    var all = [];
    this.pastWorkouts().forEach(function (w) { if (w.sets && w.sets[id]) all = all.concat(toSets(w.sets[id])); });
    return frontier(all);
  };
  App.prototype.currentFront = function (id) { return frontier(this.historyFront(id).concat(this.todaySets(id))); };
  // Para cada serie de hoy: si fue récord, de cuántas reps y cuál era la marca anterior
  App.prototype.records = function (id) {
    var sets = this.todaySets(id), front = this.historyFront(id);
    if (!front.length) return sets.map(function () { return null; });
    return sets.map(function (s) {
      var prev = maxAtLeast(front, s[1]);
      front = frontier(front.concat([s]));
      return (prev === null || s[0] > prev) ? { reps: s[1], prev: prev } : null;
    });
  };
  App.prototype.groupOf = function (id) { return groupIn(this.todayGroups(), id); };
  App.prototype.demoDays = function () {
    return Object.keys(DATA.workouts).filter(function (d) { return DATA.workouts[d].ejemplo; });
  };
  App.prototype.exerciseUsed = function (id) {
    return Object.keys(DATA.workouts).some(function (d) { var s = DATA.workouts[d].sets; return s && s[id] && s[id].length; });
  };

  // --- Escritura del entrenamiento de hoy ---
  App.prototype.saveToday = function (mutate) {

    body.extra = body.extra || []; body.groups = body.groups || []; body.sets = body.sets || {};

    body.updatedAt = Date.now();

  };

  App.prototype.openEditor = function (id, ret) {

  App.prototype.openLog = function (id) {

  };
  App.prototype.prefill = function () {
    var L = this.st.log, sets = this.todaySets(L.ex), last = this.lastTime(L.ex);
    var s = sets.length ? sets[sets.length - 1] : (last ? last.sets[0] : [0, 10]);

  App.prototype.confirm = function (title, text, okLabel, fn) {

  App.prototype.act = function (a, id) {
    var st = this.st, self = this;
    switch (a) {
      case 'tab':
        st.pick = null; st.search = ''; st.newEx = null; st.draft = null; st.sheet = null;
        st.screen = id === 'hoy' ? (this.todayActive() ? 'day' : 'home') : (id === 'rutinas' ? 'routines' : 'exercises');
        break;
      case 'open-settings': st.screen = 'settings'; break;
      case 'check-update': this.toast('Buscando versión nueva…'); checkUpdate(true); return;
      case 'import-fitnotes':
        if (!window.AppNativo || !window.AppNativo.importarFitNotes) { this.toast('Esto funciona en la app del celular.'); return; }
        window.AppNativo.importarFitNotes();
        return;
      case 'settings-back': st.screen = 'home'; break;
      case 'set-rest': writeDoc('settings', 'app', Object.assign({}, DATA.settings, { rest: +id })); break;
      case 'set-step': writeDoc('settings', 'app', Object.assign({}, DATA.settings, { step: +id })); break;
      case 'clear-demo': {
        var days = this.demoDays();
        this.confirm('Borrar datos de ejemplo', 'Se borran ' + plural(days.length, 'día', 'días') + ' de entrenamiento de ejemplo. Tus rutinas, tus ejercicios y lo que anotaste tú se quedan.', 'Borrar ejemplos', function () {
          days.forEach(function (d) { writeDoc('workouts', d, null); });
          self.toast('Datos de ejemplo borrados');
        });
        return;
      }
      case 'choose': {
        var rr = this.routine(id);
        this.saveToday(function (b) { b.routineId = id; b.groups = rr ? clone(rr.groups || []) : []; });
        st.screen = 'day';
        break;
      }
      case 'free': this.saveToday(function (b) { b.routineId = 'free'; b.groups = []; }); st.screen = 'day'; break;
      case 'change': this.saveToday(function (b) { b.routineId = null; b.groups = []; }); st.screen = 'home'; break;
      case 'open-log': case 'switch-ex': this.openLog(id); return;
      case 'log-back': st.log = null; st.sheet = null; st.screen = 'day'; break;
      case 'w-minus':
      case 'w-plus': {
        var w = parseW(st.log.w) || 0, step = DATA.settings.step || 2.5;
        w = a === 'w-plus' ? w + step : Math.max(0, w - step);
        st.log.w = fmtNum(w); st.log.error = '';
        break;
      }
      case 'r-minus':
      case 'r-plus': {
        var reps = parseInt(st.log.r, 10) || 0;
        reps = a === 'r-plus' ? reps + 1 : Math.max(0, reps - 1);
        st.log.r = String(reps); st.log.error = '';
        break;
      }
      case 'save-set': this.saveSet(); return;
      case 'edit-set': {
        var k = parseInt(id, 10), s0 = this.todaySets(st.log.ex)[k];
        if (!s0) return;
        st.log.edit = k; st.log.w = fmtNum(s0[0]); st.log.r = String(s0[1]); st.log.error = '';
        break;
      }
      case 'cancel-edit': st.log.edit = null; this.prefill(); break;
      case 'delete-set': {
        var n = st.log.edit + 1, exId = st.log.ex, idx = st.log.edit;
        this.saveToday(function (b) {
          var arr = b.sets[exId] || [];
          arr.splice(idx, 1);
          if (arr.length) b.sets[exId] = arr; else delete b.sets[exId];
        });
        st.log.edit = null; this.prefill();
        this.render(); this.toast('Serie ' + n + ' borrada');
        return;
      }
      case 'rest-add': if (st.rest) { st.rest.end += 30000; st.rest.total += 30000; } this.tick(); return;
      case 'rest-skip': this.stopRest(); break;
      case 'next-ex': {
        var ids = this.dayIds(), i2 = ids.indexOf(st.log.ex);
        if (i2 >= 0 && i2 < ids.length - 1) { this.openLog(ids[i2 + 1]); return; }
        st.log = null; st.screen = 'day';
        break;
      }
      case 'open-today': st.sheet = 'today'; break;
      case 'open-pair': st.sheet = 'pair'; break;
      case 'open-records': st.sheet = 'records'; break;
      case 'close-sheet': st.sheet = null; st.confirm = null; break;
      case 'confirm-ok': {
        var fn = st.confirm && st.confirm.fn;
        st.sheet = null; st.confirm = null;
        this.render();
        if (fn) fn();
        return;
      }
      case 'pair-with': {
        var cur = st.log.ex;
        this.saveToday(function (b) {

            .map(function (g) { return g.filter(function (x) { return x !== cur && x !== id; }); })
            .filter(function (g) { return g.length > 1; });

      }
      case 'unpair': {

        this.render(); this.toast('Superserie quitada por hoy');

      }
      case 'add-today': st.pick = { from: 'day', sel: [] }; st.search = ''; st.screen = 'picker'; break;
      case 'new-routine': this.openEditor(null, id); return;
      case 'edit-routine': this.openEditor(id, 'routines'); return;
      case 'editor-back': st.draft = null; st.screen = st.returnTo; break;
      case 'color': st.draft.color = id; break;

      case 'link-next': {

      }
      case 'add-from-catalog': st.pick = { from: 'editor', sel: [] }; st.search = ''; st.screen = 'picker'; break;
      case 'save-routine': this.saveRoutine(); return;
      case 'delete-routine': {
        var dr = st.draft;
        this.confirm('Borrar rutina', 'Se borra la rutina «' + esc(dr.name || 'sin nombre') + '». Las series que ya anotaste no se pierden.', 'Borrar rutina', function () {
          writeDoc('routines', dr.id, null);

      case 'toggle-group': st.open[id] = !st.open[id]; break;
      case 'pick-toggle': {

        st.screen = st.pick.from; st.pick = null; st.search = '';
        this.render();

  App.prototype.saveSet = function () {
    var st = this.st, L = st.log, w = parseW(L.w), r = parseInt(L.r, 10), exId = L.ex;
    if (w === null || w < 0) { L.error = 'Escribe el peso. Si es con tu propio peso, pon 0.'; this.render(); return; }
    if (!r || r < 1) { L.error = 'Pon cuántas repeticiones hiciste.'; this.render(); return; }
    w = Math.round(w * 100) / 100;
    if (L.edit !== null) {
      var n = L.edit + 1, idx = L.edit;
      this.saveToday(function (b) { var arr = b.sets[exId] || []; arr[idx] = { w: w, r: r }; b.sets[exId] = arr; });
      L.edit = null; this.prefill();
      this.render(); this.toast('Serie ' + n + ' corregida');
      return;
    }
    this.saveToday(function (b) {
      if (!b.routineId) b.routineId = 'free';
      var arr = b.sets[exId] || [];
      arr.push({ w: w, r: r });
      b.sets[exId] = arr;
    });
    L.error = '';
    this.keepAwake();
    var count = this.todaySets(exId).length;
    var recs = this.records(exId), rec = recs[recs.length - 1];
    var msg = rec
      ? '¡Récord en ' + r + ' reps! ' + (rec.prev === null ? 'Nunca habías hecho tantas.' : 'Antes: ' + (rec.prev ? fmtNum(rec.prev) + ' kg' : 'peso corporal') + '.')
      : 'Serie ' + count + ' guardada.';
    var g = this.groupOf(exId);
    if (g) {
      // Superserie: salta al siguiente ejercicio; el descanso solo al cerrar la ronda
      var pos = g.indexOf(exId), nextId = g[(pos + 1) % g.length], endRound = pos === g.length - 1;
      if (endRound) this.startRest();
      this.openLog(nextId);
      this.toast(msg + ' Ahora: ' + this.ex(nextId).name + (endRound ? '. Descansa.' : '.'));
      return;
    }
    this.startRest();
    this.render();
    this.toast(rec ? msg : msg + ' Toca descansar.');
  };

  App.prototype.startRest = function () {
    var self = this, ms = (DATA.settings.rest || 90) * 1000;
    this.st.rest = { end: Date.now() + ms, total: ms };
    clearInterval(this.restTimer);
    this.restTimer = setInterval(function () { self.tick(); }, 250);
  };
  App.prototype.stopRest = function () {
    this.st.rest = null;
    clearInterval(this.restTimer);
    this.restTimer = null;
  };
  App.prototype.tick = function () {
    var st = this.st;
    if (!st.rest) return;
    var left = st.rest.end - Date.now();
    if (left <= 0) {
      this.stopRest();
      if (st.screen === 'log') this.render();
      vibrate(700);
      this.toast('Se acabó el descanso. ¡A la siguiente serie!');
      return;
    }
    var t = this.view.querySelector('.rest-time'), b = this.view.querySelector('.rest-bar');
    if (t) t.textContent = mmss(left);
    if (b) b.style.width = (left / st.rest.total * 100) + '%';
  };
  // Mantiene la pantalla encendida mientras anotas, si el navegador lo permite
  App.prototype.keepAwake = function () {
    var self = this;
    if (this.wakeLock || !navigator.wakeLock || document.visibilityState !== 'visible') return;
    navigator.wakeLock.request('screen').then(function (lock) {
      self.wakeLock = lock;
      lock.addEventListener('release', function () { self.wakeLock = null; });
    }, function () {});
  };

  App.prototype.saveRoutine = function () {
    var st = this.st, d = st.draft, name = d.name.trim();
    if (!name) { d.error = 'Ponle un nombre a la rutina.'; this.render(); this.focus('rname'); return; }
    var wasNew = !d.id;
    var id = d.id || newId('rut');
    var prev = DATA.routines[id];
    var maxOrder = 0;
    Object.keys(DATA.routines).forEach(function (k) { maxOrder = Math.max(maxOrder, DATA.routines[k].order || 0); });
    writeDoc('routines', id, {
      name: name, color: d.color, image: d.image, photo: d.photo || null,
      ex: d.ex.slice(), groups: fromGroups(d.groups),
      order: prev ? (prev.order || 0) : maxOrder + 1
    });
    st.draft = null;
    st.screen = st.returnTo;
    this.render();
    this.toast(wasNew ? 'Rutina «' + name + '» creada' : 'Rutina guardada');
  };

  App.prototype.saveExercise = function () {
    var st = this.st, n = st.newEx, name = n.name.trim();
    if (!name) { n.error = 'Escribe el nombre del ejercicio.'; this.render(); this.focus('exname'); return; }
    var dup = Object.keys(DATA.exercises).some(function (k) { return k !== n.id && DATA.exercises[k].name.toLowerCase() === name.toLowerCase(); });
    if (dup) { n.error = 'Ya tienes un ejercicio con ese nombre.'; this.render(); this.focus('exname'); return; }
    var id = n.id || newId('ej');
    writeDoc('exercises', id, { name: name, muscle: n.muscle });
    st.open[n.muscle] = true;
    var wasNew = !n.id, muscle = n.muscle;
    st.newEx = null;
    st.screen = 'exercises';

    this.toast(wasNew ? '«' + name + '» agregado a ' + muscle : 'Ejercicio guardado');

  App.prototype.deleteExercise = function () {
    var self = this, st = this.st, id = st.newEx.id, e = this.ex(id);
    if (!e) return;
    if (this.exerciseUsed(id)) {
      this.toast('No se puede borrar: ya tiene series guardadas. Puedes cambiarle el nombre.');
      return;
    }
    var inRoutines = this.routinesSorted().filter(function (r) { return (r.ex || []).indexOf(id) >= 0; });
    var extra = inRoutines.length ? ' También se quita de ' + plural(inRoutines.length, 'rutina', 'rutinas') + '.' : '';
    this.confirm('Borrar ejercicio', 'Se borra «' + esc(e.name) + '» de tu catálogo.' + extra, 'Borrar ejercicio', function () {
      inRoutines.forEach(function (r) {
        var body = clone(DATA.routines[r.id]);
        body.ex = (body.ex || []).filter(function (x) { return x !== id; });
        body.groups = fromGroups(toGroups(body.groups).filter(function (g) { return g.indexOf(id) < 0; }));
        writeDoc('routines', r.id, body);
      });
      writeDoc('exercises', id, null);
      st.newEx = null; st.screen = 'exercises';
      self.render();
      self.toast('Ejercicio borrado');

  };

  App.prototype.loadPhoto = function (file) {
    var self = this;
    if (!file.type || file.type.indexOf('image/') !== 0) { this.toast('Ese archivo no es una imagen. Elige una foto.'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var url = null;
        try {
          var sc = Math.min(1, 480 / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          url = c.toDataURL('image/jpeg', 0.8);
        } catch (err) { url = null; }
        if (!url || url.length > 200000) { self.toast('Esa foto es muy pesada. Prueba con otra.'); return; }
        if (!self.st.draft) return;
        self.st.draft.photo = url;
        self.st.draft.image = 'photo';
        self.render();
        self.toast('Foto lista. Toca Guardar para usarla.');
      };
      img.onerror = function () { self.toast('No pude abrir esa imagen. Prueba con otra foto.'); };
      img.src = reader.result;
    };
    reader.onerror = function () { self.toast('No pude leer ese archivo. Prueba con otra foto.'); };
    reader.readAsDataURL(file);
  };

  App.prototype.onInput = function (key, value) {

      st.newEx.name = value;
      if (st.newEx.error) { st.newEx.error = ''; this.render(); }

    if ((key === 'w' || key === 'r') && st.log) {

  App.prototype.render = function () {
    var st = this.st;
    var ready = mode === 'device' || (mode === 'db' && loaded.exercises && loaded.routines && loaded.workouts);

    // Al abrir: si ya elegiste rutina hoy, vas directo a ella
    if (ready && st.autoDay) {
      st.autoDay = false;
      if (st.screen === 'home' && this.todayActive()) st.screen = 'day';
    }
    // Si algo que se mostraba ya no existe, vuelve a un lugar seguro
    if (ready) {
      if (st.screen === 'day' && !this.todayActive()) st.screen = 'home';
      if (st.screen === 'log' && (!st.log || !DATA.exercises[st.log.ex])) { st.log = null; st.screen = this.todayActive() ? 'day' : 'home'; }
    }

    var prevBody = this.view.querySelector('.scr-body');
    // Se conserva el desplazamiento solo si sigue la misma pantalla (y, al anotar, el mismo ejercicio)
    var logEx = st.screen === 'log' && st.log ? st.log.ex : null;
    var keepScroll = (this.lastScreen === st.screen && this.lastLogEx === logEx && prevBody) ? prevBody.scrollTop : 0;
    this.lastLogEx = logEx;
    var ae = document.activeElement, focusKey = null, sS = null, sE = null;
    if (ae && this.el.contains(ae) && ae.getAttribute('data-input')) {
      focusKey = ae.getAttribute('data-input');
      try { sS = ae.selectionStart; sE = ae.selectionEnd; } catch (e) {}
    }

    var html;
    if (mode === 'local') html = this.scr_nodb();
    else if (!ready) html = '<div class="center"><span class="spinner" aria-hidden="true"></span><p>Cargando tu app…</p></div>';
    else {
      var hasNav = ['home', 'day', 'routines', 'exercises'].indexOf(st.screen) >= 0;
      html = this['scr_' + st.screen]() + (hasNav ? this.nav() : '');

    this.view.innerHTML = html;

    var body = this.view.querySelector('.scr-body');
    if (body) body.scrollTop = keepScroll;
    var strip = this.view.querySelector('.exstrip'), onChip = strip && strip.querySelector('.xchip.on');
    if (onChip) strip.scrollLeft = Math.max(0, onChip.offsetLeft - 12);
    var cmpCell = this.view.querySelector('.cmp-c.next, .cmp-c.editing'), cmpBox = cmpCell && cmpCell.closest('.cmp-scroll');
    if (cmpBox && cmpCell.offsetLeft + cmpCell.offsetWidth > cmpBox.clientWidth) {
      cmpBox.scrollLeft = cmpCell.offsetLeft + cmpCell.offsetWidth - cmpBox.clientWidth + 8;
    }
    if (focusKey) {
      var inp = this.view.querySelector('[data-input="' + focusKey + '"]');
      if (inp) {
        try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); }
        try { if (sS !== null) inp.setSelectionRange(sS, sE); } catch (e) {}
      }

    this.lastScreen = st.screen;
    // En el celular la pantalla no se apaga mientras anotas series
    var awake = st.screen === 'log';

  };

  // Botón «atrás» del celular: devuelve true si la app lo usó, false para salir
  App.prototype.back = function () {
    var st = this.st;
    if (mode !== 'db' && mode !== 'device') return false;
    if (st.sheet) { this.act('close-sheet'); return true; }
    switch (st.screen) {
      case 'log': this.act('log-back'); return true;

  App.prototype.scr_day = function () {
    var w = this.todayDoc(), self = this, T = longToday();

    var ids = this.dayIds(), extras = w.extra || [];
    var doneCount = 0;
    function rowHtml(id, inGroup) {
      var e = self.ex(id);
      if (!e) return '';
      var extra = !free && extras.indexOf(id) >= 0 && !(r && (r.ex || []).indexOf(id) >= 0);
      var today = self.todaySets(id), done = today.length > 0, last = done ? null : self.lastTime(id);

      var line = done
        ? '<span class="ex-last done">Hoy · ' + setsLine(today) + '</span>'

        i++;

        rows += '<li>' + rowHtml(ids[i], false) + '</li>';

  // Aviso de qué peso hay que superar para hacer récord con las reps escritas
  App.prototype.recHint = function () {

    var r = parseInt(L.r, 10), w = parseW(L.w);
    if (!r || r < 1 || w === null) return '<p class="rec-hint"></p>';
    var front = this.currentFront(L.ex), prev = maxAtLeast(front, r), txt, on;
    if (prev === null) { on = true; txt = 'Nunca has hecho ' + r + ' reps o más: será récord'; }
    else if (w > prev) { on = true; txt = 'Con ' + fmtNum(w) + ' kg sería récord en ' + r + ' reps'; }
    else if (w === 0) { on = false; txt = 'Para récord: más de ' + maxRepsAt(front, 0) + ' reps'; }
    else { on = false; txt = 'Para récord con ' + r + ' reps: más de ' + fmtNum(prev) + ' kg'; }
    return '<p class="rec-hint' + (on ? ' on' : '') + '">' + ICON.trophy + '<span>' + txt + '</span></p>';
  };

  App.prototype.scr_log = function () {
    var st = this.st, L = st.log, e = this.ex(L.ex), self = this;
    var sets = this.todaySets(L.ex), recs = this.records(L.ex), last = this.lastTime(L.ex);

      '<button type="button" class="tb-btn" data-act="open-today"><span class="tb-name">' + esc(e.name) + '</span>' +
      '<span class="tb-sub">' + esc(sub) + ' · ver todo' + ICON.chevDown + '</span></button></div>' +
      strip +
      '<div class="scr-body">' + superbox + cmp + entry + '</div>' +
      '<div class="log-foot">' + rest + next + '</div>' + sheet;
  };

  App.prototype.confirmSheet = function () {
    var cf = this.st.confirm;
    if (!cf) return '';
    return sheetHtml(esc(cf.title), cf.text,
      '<div class="sheet-actions"><button type="button" class="btn-del" data-act="confirm-ok">' + esc(cf.ok) + '</button>' +
      '<button type="button" class="btn-ghost" data-act="close-sheet">Cancelar</button></div>');
  };

  App.prototype.scr_routines = function () {
    var self = this;
    var cards = this.routinesSorted().map(function (r) {
      var names = self.routineEx(r).map(function (id) { return DATA.exercises[id].name; });
      var meta = names.length ? names.slice(0, 3).join(', ') + (names.length > 3 ? ' y ' + (names.length - 3) + ' más' : '') : 'Sin ejercicios todavía';
      return '<button type="button" class="rcard" data-act="edit-routine" data-id="' + r.id + '">' + art(r, 'thumb') +
        '<span class="rc-main"><span class="rc-name">' + esc(r.name) + '</span><span class="rc-meta two">' + esc(meta) + '</span></span>' +
        ICON.chev + '</button>';
    }).join('');
    return '<div class="scr-body top">' +
      '<div class="title-row"><span class="scr-title">Rutinas</span><button type="button" class="fab" data-act="new-routine" data-id="routines" aria-label="Crear rutina nueva">' + ICON.plusBig + '</button></div>' +
      '<p class="small">Lo que haces en un día. Tócala para editarla.</p>' +
      (cards ? '<div class="stack">' + cards + '</div>' : '<p class="empty">Todavía no tienes rutinas.</p>') +
      '<button type="button" class="dashed" data-act="new-routine" data-id="routines">' + ICON.plus + 'Crear rutina nueva</button>' +
      '</div>';
  };

  App.prototype.scr_editor = function () {
    var d = this.st.draft, self = this;
    var preview = art(d, 'wide', '<span class="over pv-name">' + esc(d.name.trim() || 'Tu rutina') + '</span>');
    var tiles = IMAGE_ORDER.map(function (id) {
      return '<button type="button" class="bank-item" data-act="pick-image" data-id="' + id + '" aria-pressed="' + (d.image === id) + '">' +
        art({ image: id, color: d.color }, 'tile') + '<span class="bank-lbl">' + IMAGES[id].label + '</span></button>';
    }).join('');
    if (d.photo) {
      tiles += '<button type="button" class="bank-item" data-act="pick-image" data-id="photo" aria-pressed="' + (d.image === 'photo') + '">' +
        art({ image: 'photo', photo: d.photo, color: d.color }, 'tile') + '<span class="bank-lbl">Tu foto</span></button>';
    }
    tiles += '<label class="bank-item upload" for="in-photo"><span class="up-box">' + ICON.camera + '</span>' +
      '<span class="bank-lbl">' + (d.photo ? 'Cambiar foto' : 'Subir foto') + '</span>' +
      '<input id="in-photo" class="sr" type="file" accept="image/*" data-file="photo"></label>';
    var sw = COLOR_ORDER.map(function (k) {
      var p = PLATES[k];
      return '<button type="button" class="sw" data-act="color" data-id="' + k + '" aria-label="' + p.label + '" aria-pressed="' + (d.color === k) + '" style="--pc:' + p.bg + ';--pr:' + p.ring + ';--pb:' + (p.border || p.bg) + '"></button>';
    }).join('');
    // Entre dos ejercicios seguidos: botón para unirlos en superserie, o la marca de que ya lo están
    var rows = '';
    d.ex.forEach(function (id, i) {
      var e = self.ex(id);
      if (!e) return;
      var gA = groupIn(d.groups, id);
      rows += '<li' + (gA ? ' class="grp-on"' : '') + '><span class="ed-txt"><span class="ed-name">' + esc(e.name) + '</span><span class="ed-mus">' + esc(e.muscle) + '</span></span>' +
        '<button type="button" class="icon-btn subtle" data-act="remove-ex" data-id="' + id + '" aria-label="Quitar ' + esc(e.name) + '">' + ICON.x + '</button></li>';
      var nextId = d.ex[i + 1];
      if (!nextId) return;
      var gB = groupIn(d.groups, nextId);
      if (gA && gA === gB) {
        rows += '<li class="edlink on"><span class="sg-tag">' + ICON.swap + 'Superserie</span><button type="button" class="edlink-btn" data-act="unlink" data-id="' + i + '">Separar</button></li>';
      } else if (!gA && !gB) {
        rows += '<li class="edlink"><button type="button" class="edlink-btn" data-act="link-next" data-id="' + i + '">' + ICON.swap + 'Unir en superserie</button></li>';
      }
    });
    var err = d.error ? '<p class="err-msg" id="rname-err">' + esc(d.error) + '</p>' : '';
    return '<div class="topbar"><button type="button" class="icon-btn" data-act="editor-back" aria-label="Volver sin guardar">' + ICON.back + '</button>' +
      '<span class="tb-title">' + (d.id ? 'Editar rutina' : 'Nueva rutina') + '</span>' +
      '<button type="button" class="btn-primary" data-act="save-routine">Guardar</button></div>' +
      '<div class="scr-body">' +
      '<div class="field"><label class="lbl" for="in-rname">Nombre</label>' +
      '<input id="in-rname" class="inp' + (d.error ? ' err' : '') + '" data-input="rname" type="text" value="' + esc(d.name) + '" placeholder="Ej.: Torso, Pierna, Empuje" autocomplete="off"' + (d.error ? ' aria-invalid="true" aria-describedby="rname-err"' : '') + '>' + err + '</div>' +
      '<div class="field"><span class="lbl">Imagen</span>' + preview + '<div class="bank">' + tiles + '</div></div>' +
      '<div class="field"><span class="lbl">Color de fondo</span><div class="swatches">' + sw + '</div></div>' +
      '<div class="field"><span class="lbl">Ejercicios · ' + d.ex.length + '</span>' +
      (d.ex.length ? '<ul class="edlist">' + rows + '</ul>' : '<p class="empty">Todavía no tiene ejercicios. Agrégalos desde tu catálogo.</p>') +
      '<button type="button" class="btn-outline" data-act="add-from-catalog">' + ICON.plus + 'Agregar ejercicios del catálogo</button></div>' +
      (d.id ? '<button type="button" class="btn-del" data-act="delete-routine">Borrar rutina</button>' : '') +
      '</div>' + (this.st.sheet === 'confirm' ? this.confirmSheet() : '');
  };

  App.prototype.searchBox = function () {
    return '<div class="search"><label class="sr" for="in-search">Buscar ejercicio</label>' + ICON.search +
      '<input id="in-search" class="inp" type="search" data-input="search" value="' + esc(this.st.search) + '" placeholder="Buscar ejercicio" autocomplete="off"></div>';
  };

  App.prototype.pickExcluded = function () {
    var st = this.st;
    if (!st.pick) return [];
    return st.pick.from === 'editor' ? st.draft.ex : this.dayIds();
  };

  App.prototype.groups = function (mode) {
    var st = this.st, q = st.search.trim().toLowerCase();
    var excluded = mode === 'pick' ? this.pickExcluded() : [];
    var all = Object.keys(DATA.exercises).map(this.ex, this).sort(function (a, b) { return a.name.localeCompare(b.name, 'es'); });
    var any = false;
    var html = musclesAll().map(function (m) {
      var list = all.filter(function (e) { return e.muscle === m && (!q || e.name.toLowerCase().indexOf(q) >= 0); });
      if (q && !list.length) return '';
      if (list.length) any = true;
      var open = q ? true : !!st.open[m];
      var items = list.map(function (e) {
        if (mode !== 'pick') return '<li><button type="button" class="gi" data-act="edit-exercise" data-id="' + e.id + '"><span class="gi-name">' + esc(e.name) + '</span>' + ICON.chev + '</button></li>';
        var already = excluded.indexOf(e.id) >= 0;
        var on = already || st.pick.sel.indexOf(e.id) >= 0;
        return '<li><button type="button" class="gi' + (on ? ' on' : '') + '" data-act="pick-toggle" data-id="' + e.id + '" aria-pressed="' + on + '"' + (already ? ' disabled' : '') + '>' +
          '<span class="box">' + (on ? ICON.check : '') + '</span><span class="gi-name">' + esc(e.name) + '</span>' +
          (already ? '<span class="already">ya está</span>' : '') + '</button></li>';
      }).join('');
      return '<div class="grp"><button type="button" class="grp-head" data-act="toggle-group" data-id="' + m + '" aria-expanded="' + open + '">' +
        '<span class="grp-name">' + m + '</span><span class="count">' + list.length + '</span>' + (open ? ICON.up : ICON.down) + '</button>' +
        (open && list.length ? '<ul class="grp-list">' + items + '</ul>' : '') + '</div>';
    }).join('');
    if (q && !any) return '<p class="empty">No encontré «' + esc(st.search.trim()) + '».' + (mode === 'pick' ? '' : ' Puedes crearlo con el botón +.') + '</p>';
    return '<div class="groups">' + html + '</div>';
  };

  App.prototype.scr_exercises = function () {
    return '<div class="scr-body top">' +
      '<div class="title-row"><span class="scr-title">Ejercicios</span><button type="button" class="fab" data-act="new-exercise" aria-label="Crear ejercicio nuevo">' + ICON.plusBig + '</button></div>' +
      '<p class="small">Tu catálogo, ordenado por músculo. Toca uno para cambiarle el nombre o el músculo.</p>' +
      this.searchBox() + this.groups('browse') + '</div>';
  };

  App.prototype.scr_picker = function () {
    var st = this.st, n = st.pick.sel.length, w = this.todayDoc();
    var hint = st.pick.from === 'editor'
      ? 'Marca los que quieres en la rutina.'
      : (w && w.routineId === 'free' ? 'Marca los que vas a hacer hoy.' : 'Marca los que vas a hacer hoy además de la rutina.');
    return '<div class="topbar"><button type="button" class="icon-btn" data-act="pick-cancel" aria-label="Cancelar">' + ICON.back + '</button>' +
      '<span class="tb-title">Elegir ejercicios</span>' +
      '<button type="button" class="btn-primary" data-act="pick-done"' + (n ? '' : ' disabled') + '>Agregar' + (n ? ' (' + n + ')' : '') + '</button></div>' +
      '<div class="scr-body"><p class="small">' + hint + '</p>' + this.searchBox() + this.groups('pick') + '</div>';
  };

  App.prototype.scr_newex = function () {
    var n = this.st.newEx;
    var chips = musclesAll().map(function (m) {
      var on = n.muscle === m;
      return '<button type="button" class="mchip' + (on ? ' on' : '') + '" data-act="newex-muscle" data-id="' + m + '" aria-pressed="' + on + '">' + m + '</button>';
    }).join('');
    var err = n.error ? '<p class="err-msg" id="exname-err">' + esc(n.error) + '</p>' : '';
    return '<div class="topbar"><button type="button" class="icon-btn" data-act="newex-back" aria-label="Volver sin guardar">' + ICON.back + '</button>' +
      '<span class="tb-title">' + (n.id ? 'Editar ejercicio' : 'Nuevo ejercicio') + '</span>' +
      '<button type="button" class="btn-primary" data-act="newex-save">Guardar</button></div>' +
      '<div class="scr-body">' +
      '<div class="field"><label class="lbl" for="in-exname">Nombre</label>' +
      '<input id="in-exname" class="inp' + (n.error ? ' err' : '') + '" data-input="exname" type="text" value="' + esc(n.name) + '" placeholder="Ej.: Press de banca" autocomplete="off"' + (n.error ? ' aria-invalid="true" aria-describedby="exname-err"' : '') + '>' + err + '</div>' +
      '<div class="field"><span class="lbl">Músculo</span><div class="mchips">' + chips + '</div></div>' +
      (n.id ? '<button type="button" class="btn-del" data-act="delete-exercise">Borrar ejercicio</button>' : '') +
      '</div>' + (this.st.sheet === 'confirm' ? this.confirmSheet() : '');
  };

  App.prototype.scr_settings = function () {
    var s = DATA.settings, demo = this.demoDays();
    var rest = REST_OPTIONS.map(function (v) {
      var on = s.rest === v;
      return '<button type="button" class="mchip' + (on ? ' on' : '') + '" data-act="set-rest" data-id="' + v + '" aria-pressed="' + on + '">' + (v % 60 ? mmss(v * 1000) : (v / 60) + ' min') + '</button>';
    }).join('');
    var steps = STEP_OPTIONS.map(function (v) {
      var on = s.step === v;
      return '<button type="button" class="mchip' + (on ? ' on' : '') + '" data-act="set-step" data-id="' + v + '" aria-pressed="' + on + '">' + fmtNum(v) + ' kg</button>';
    }).join('');
    return '<div class="topbar"><button type="button" class="icon-btn" data-act="settings-back" aria-label="Volver al inicio">' + ICON.back + '</button>' +
      '<span class="tb-title">Ajustes</span></div>' +
      '<div class="scr-body">' +
      '<div class="set-box"><h2>Descanso entre series</h2><p class="small">Arranca solo al guardar una serie.</p><div class="opts">' + rest + '</div></div>' +
      '<div class="set-box"><h2>Botón + del peso</h2><p class="small">Cuánto sube o baja el peso con − y +.</p><div class="opts">' + steps + '</div></div>' +
      '<div class="set-box"><h2>Datos de ejemplo</h2>' +
      (demo.length
        ? '<p class="small">Hay ' + plural(demo.length, 'día', 'días') + ' de entrenamiento de ejemplo para probar «la vez pasada» y los récords. Bórralos cuando empieces a usar la app en serio.</p><button type="button" class="btn-del" data-act="clear-demo">Borrar datos de ejemplo</button>'
        : '<p class="small">No hay datos de ejemplo. Todo lo que ves lo anotaste tú.</p>') +
      '</div>' +
      '<div class="set-box"><h2>Lista de pruebas</h2><p class="small">Lo que hay que probar en esta versión. Marca Bien o Falla y deja notas.</p>' +
      '<a class="btn-outline" href="https://claude.ai/artifact/FevVpa4mcKXbkHV39jRD9B" target="_blank" rel="noopener" style="text-decoration: none;">Abrir la lista de pruebas</a></div>' +
      (esApk
        ? '<div class="set-box"><h2>Traer tus datos de FitNotes</h2>' +
          '<ol class="mini-steps"><li>En FitNotes, abre «Backup» y toca «Save Backup», o «Share Backup» para mandártelo al celular.</li>' +
          '<li>Aquí, toca el botón y elige ese archivo. Su nombre empieza con FitNotes_Backup.</li></ol>' +
          '<p class="small">Se traen tus ejercicios, categorías, rutinas, series y superseries. Reemplaza lo que hay ahora en la app, incluidos los datos de ejemplo. Antes de cambiar nada te muestro lo que encontré.</p>' +
          '<button type="button" class="btn-outline" data-act="import-fitnotes">Elegir respaldo de FitNotes</button></div>'
        : '') +
      (esApk
        ? '<div class="set-box"><h2>Versión ' + esc(APP_VERSION) + '</h2><p class="small">La app revisa sola al abrirse si hay una versión nueva en GitHub.</p>' +
          (update ? updateLink() : '<button type="button" class="btn-outline" data-act="check-update">Buscar versión nueva</button>') + '</div>'
        : '') +
      '<div class="set-box"><h2>Dónde se guardan tus datos</h2><p class="small">' +
      (mode === 'device'
        ? 'En este celular. Siguen ahí aunque cierres la app o instales una versión nueva, pero se borran si desinstalas la app.'
        : 'En tu cuenta de Claude. Solo tú los puedes ver.') + '</p></div>' +
      (esApk ? '' : '<p class="small">Copia de prueba en Claude. La app del celular se descarga de github.com/' + REPO + '.</p>') +
      '</div>' + (this.st.sheet === 'confirm' ? this.confirmSheet() : '');
  };

  // ---------- Arranque ----------
  var app = new App(document.getElementById('app'));
  window.appBack = function () { return app.back(); };
  // Dentro de Claude: base del Artifact. En la app Android o en un navegador: guardado en el propio aparato
  var claudeApi = window.claude && typeof window.claude.use === 'function' ? window.claude : null;
  if (!claudeApi) {
    startDevice();
    checkUpdate(false);
  } else {
    claudeApi.use('db').then(function (handle) {
      if (!handle) { startDevice(); return; }
      db = handle;
      mode = 'db';
      subscribe();
      app.render();
    }, startDevice);
  }
})();
</script>
